# Minimal TF-M, fits the flash layout without a bootloader (see app.overlay)
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_LOG=y

# LTE
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y

# Time from the LTE network only
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_MODEM=y
CONFIG_DATE_TIME_NTP=n

# Weather forecast from api.met.no over TLS, verified with a certificate stored in the modem
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_MODEM_KEY_MGMT=y

CONFIG_MAIN_STACK_SIZE=2048

# Button 1 switches between countdown, clock and weather
CONFIG_DK_LIBRARY=y
